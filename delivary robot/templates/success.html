{% extends "base.html" %}

{% block title %}Order Successful{% endblock %}

{% block content %}
<div class="container py-5">
    <div class="row justify-content-center">
        <div class="col-md-6 text-center">
            <div class="card shadow">
                <div class="card-body py-5">
                    <div class="success-animation">
                        <i class="fas fa-check-circle text-success" style="font-size: 80px;"></i>
                    </div>
                    <h2 class="mt-4 text-success">Order Successful!</h2>
                    <p class="lead">Your item has been delivered successfully.</p>
                    <p class="text-muted">Thank you for using DeliveryBot service.</p>
                    
                    <div class="mt-4">
                        <a href="{{ url_for('dashboard') }}" class="btn btn-primary me-2">
                            <i class="fas fa-shopping-bag"></i> Continue Shopping
                        </a>
                        <a href="{{ url_for('history') }}" class="btn btn-outline-secondary">
                            <i class="fas fa-history"></i> View History
                        </a>
                    </div>
                </div>
            </div>
        </div>
    </div>
</div>
{% endblock %}
