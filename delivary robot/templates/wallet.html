{% extends "base.html" %}

{% block title %}Wallet{% endblock %}

{% block content %}
<div class="container py-5">
    <div class="row justify-content-center">
        <div class="col-md-8">
            <div class="card shadow">
                <div class="card-header bg-info text-white">
                    <h4 class="mb-0"><i class="fas fa-wallet"></i> My Wallet</h4>
                </div>
                <div class="card-body">
                    <!-- Current Balance -->
                    <div class="text-center mb-4">
                        <h3>Current Balance</h3>
                        <div class="balance-display fs-1 text-success fw-bold">
                            ₹{{ "%.2f"|format(user.wallet_balance) }}
                        </div>
                    </div>

                    <!-- Add Money Form -->
                    <div class="add-money-section">
                        <h5 class="mb-3">Add Money to Wallet</h5>
                        <form method="POST">
                            <div class="row">
                                <div class="col-md-8">
                                    <div class="input-group">
                                        <span class="input-group-text">₹</span>
                                        <input type="number" class="form-control" name="amount" 
                                               min="1" max="10000" step="0.01" 
                                               placeholder="Enter amount" required>
                                    </div>
                                </div>
                                <div class="col-md-4">
                                    <button type="submit" class="btn btn-success w-100">
                                        <i class="fas fa-plus"></i> Add Money
                                    </button>
                                </div>
                            </div>
                        </form>
                    </div>

                    <!-- Quick Add Buttons -->
                    <div class="quick-add mt-4">
                        <h6 class="mb-3">Quick Add:</h6>
                        <div class="row">
                            <div class="col-3">
                                <form method="POST" class="d-inline">
                                    <input type="hidden" name="amount" value="10">
                                    <button type="submit" class="btn btn-outline-primary btn-sm w-100">₹10</button>
                                </form>
                            </div>
                            <div class="col-3">
                                <form method="POST" class="d-inline">
                                    <input type="hidden" name="amount" value="50">
                                    <button type="submit" class="btn btn-outline-primary btn-sm w-100">₹50</button>
                                </form>
                            </div>
                            <div class="col-3">
                                <form method="POST" class="d-inline">
                                    <input type="hidden" name="amount" value="100">
                                    <button type="submit" class="btn btn-outline-primary btn-sm w-100">₹100</button>
                                </form>
                            </div>
                            <div class="col-3">
                                <form method="POST" class="d-inline">
                                    <input type="hidden" name="amount" value="500">
                                    <button type="submit" class="btn btn-outline-primary btn-sm w-100">₹500</button>
                                </form>
                            </div>
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </div>
</div>
{% endblock %}
